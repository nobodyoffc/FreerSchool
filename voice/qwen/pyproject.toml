[project]
name = "freer-voice-qwen"
version = "0.1.0"
description = "Narrate episodes with Qwen3-TTS, cloning the Navigator's FreerVoice"
requires-python = ">=3.12,<3.13"
dependencies = [
    "qwen-tts==0.1.1",
    "qwen-asr==0.0.6",
    "torch==2.14.1",
    "torchaudio",
    "soundfile==0.12.1",
    "numpy",
]

[tool.uv]
package = false
# qwen-asr pins transformers 4.57.6, qwen-tts 4.57.3; the aligner runs on either.
override-dependencies = ["transformers==4.57.3"]
