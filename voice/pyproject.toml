[project]
name = "freer-voice"
version = "0.1.0"
description = "Derive a unique, reproducible voice from an FID"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kokoro==0.9.4",
    "misaki[zh,en]==0.9.4",
    "soundfile==0.12.1",
    "pillow==11.0.0",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[dependency-groups]
analysis = [
    "librosa==0.11.0",
    "speechbrain==1.1.1",
]
